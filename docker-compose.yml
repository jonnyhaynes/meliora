services:
  postgres:
    restart: always
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: meliora
      POSTGRES_PASSWORD: meliora
      POSTGRES_DB: meliora
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host port 55432 to avoid colliding with the many other Postgres
      # instances already running on this machine.
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U meliora -d meliora']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
